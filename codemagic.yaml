workflows:
  android-apk:
    name: Android APK
    max_build_duration: 60
    environment:
      flutter: stable
      vars:
        API_URL: "https://YOUR-SERVER.onrender.com"
    scripts:
      - name: Get packages
        script: cd flutter_app && flutter pub get
      - name: Build APK
        script: cd flutter_app && flutter build apk --release --dart-define=API_URL=$API_URL
    artifacts:
      - flutter_app/build/app/outputs/flutter-apk/app-release.apk

  web-release:
    name: Flutter Web
    max_build_duration: 60
    environment:
      flutter: stable
      vars:
        API_URL: "https://YOUR-SERVER.onrender.com"
    scripts:
      - name: Get packages
        script: cd flutter_app && flutter pub get
      - name: Build web
        script: cd flutter_app && flutter build web --release --dart-define=API_URL=$API_URL
    artifacts:
      - flutter_app/build/web/**
